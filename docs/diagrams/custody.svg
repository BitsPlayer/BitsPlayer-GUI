<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img">
  <title>Chain of custody</title>
  <desc>Evidence, artifacts, build identity, and case metadata are hashed into a chained audit log. Sealing stores the final hash and an Ed25519 signature checked with a key kept outside the case.</desc>
  <defs>
    <marker id="link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3d6b7a"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f4f1ea"/>
  <text x="40" y="40" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Chain of custody</text>
  <text x="40" y="64" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Hashes name the bytes. The chain names the order they were recorded.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="96" width="200" height="84" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="56" y="128" fill="#1c1915" font-size="15" font-weight="650">Source MP4</text>
    <text x="56" y="152" fill="#6b645c" font-size="12">Read, then hashed</text>
    <text x="56" y="168" fill="#6b645c" font-size="12">again after analysis</text>

    <rect x="264" y="96" width="200" height="84" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="280" y="128" fill="#1c1915" font-size="15" font-weight="650">Recovered PNGs</text>
    <text x="280" y="152" fill="#6b645c" font-size="12">Saved to a folder</text>
    <text x="280" y="168" fill="#6b645c" font-size="12">the examiner picks</text>

    <rect x="488" y="96" width="200" height="84" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="504" y="128" fill="#1c1915" font-size="15" font-weight="650">This build</text>
    <text x="504" y="152" fill="#6b645c" font-size="12">Commit, Cargo.lock,</text>
    <text x="504" y="168" fill="#6b645c" font-size="12">and binary hash</text>

    <rect x="712" y="96" width="208" height="84" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="728" y="128" fill="#1c1915" font-size="15" font-weight="650">case.json</text>
    <text x="728" y="152" fill="#6b645c" font-size="12">Name, id, examiner,</text>
    <text x="728" y="168" fill="#6b645c" font-size="12">case directory</text>
  </g>

  <g fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <line x1="140" y1="180" x2="140" y2="228" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="148" y="210">SHA-256</text>
    <line x1="364" y1="180" x2="364" y2="228" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="372" y="210">SHA-256</text>
    <line x1="588" y1="180" x2="500" y2="228" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="530" y="204">on every entry</text>
    <line x1="816" y1="180" x2="760" y2="228" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="790" y="204">metadata hash</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="228" width="230" height="72" rx="10" fill="#eef3f4" stroke="#c5d4d8"/>
    <text x="56" y="258" fill="#1c1915" font-size="15" font-weight="650">#1  CASE_CREATED</text>
    <text x="56" y="280" fill="#6b645c" font-size="12">Head hash starts here.</text>

    <line x1="270" y1="264" x2="354" y2="264" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="274" y="252" fill="#6b645c" font-size="11">previous hash</text>

    <rect x="354" y="228" width="230" height="72" rx="10" fill="#eef3f4" stroke="#c5d4d8"/>
    <text x="370" y="258" fill="#1c1915" font-size="15" font-weight="650">#2 … work entries</text>
    <text x="370" y="280" fill="#6b645c" font-size="12">Analysis, extract, artifacts</text>

    <line x1="584" y1="264" x2="668" y2="264" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="588" y="252" fill="#6b645c" font-size="11">previous hash</text>

    <rect x="668" y="228" width="252" height="72" rx="10" fill="#f8f1e3" stroke="#e4d3b0"/>
    <text x="684" y="258" fill="#1c1915" font-size="15" font-weight="650">#n  CASE_CLOSED</text>
    <text x="684" y="280" fill="#6b645c" font-size="12">Written only by a successful seal</text>
  </g>

  <text x="40" y="322" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">logs/audit.jsonl — one JSON object per line. Each entry hash covers its fields and the previous hash.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M 795 300 V 348 H 180 V 376" stroke="#3d6b7a" stroke-width="1.5" fill="none" marker-end="url(#link)"/>
    <text x="400" y="340" fill="#6b645c" font-size="12">final head hash</text>

    <rect x="40" y="376" width="280" height="80" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="56" y="400" fill="#1c1915" font-size="15" font-weight="650">case_closure.json</text>
    <text x="56" y="424" fill="#6b645c" font-size="13">Final sequence and head hash</text>

    <line x1="320" y1="416" x2="368" y2="416" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>

    <rect x="368" y="376" width="280" height="80" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="384" y="400" fill="#1c1915" font-size="15" font-weight="650">case_signature.json</text>
    <text x="384" y="424" fill="#6b645c" font-size="13">Ed25519 over that sealed head</text>

    <line x1="648" y1="416" x2="696" y2="416" stroke="#8a5a12" stroke-width="1.5" marker-end="url(#link)"/>
    <text x="654" y="404" fill="#8a5a12" font-size="11">trust</text>

    <rect x="696" y="376" width="224" height="80" rx="10" fill="#fffcf7" stroke="#e4d3b0"/>
    <text x="712" y="400" fill="#1c1915" font-size="15" font-weight="650">Trusted public key</text>
    <text x="712" y="424" fill="#6b645c" font-size="12">~/.config/bitsplayer/signing/</text>
  </g>

  <text x="40" y="496" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">What a check recomputes</text>
  <text x="40" y="522" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">The verifier walks the log, rebuilds every entry hash, and compares the last one with the closure.</text>
  <text x="40" y="542" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">It then checks the signature with the trusted key, and re-hashes each PNG when those folders are supplied.</text>
</svg>
