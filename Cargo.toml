[package]
name = "bitsplayer"
version = "0.1.0"
edition = "2024"
description = "Forensic MP4 layout analysis and truncated-file I-frame recovery"
default-run = "bitsplayer"

[dependencies]
anyhow = "1"
bitplay = { path = "vendor/video-analyzer", package = "BitPlay" }
iced = { version = "0.13", features = ["image", "canvas", "tokio", "advanced", "lazy"] }
iframe-extract = { path = "vendor/iframe-extract" }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
tokio = { version = "1", features = ["rt", "time"] }
rayon = "1"

sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zip = "2"
pdf-writer = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
cms = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["oid", "derive"] }
spki = "0.7"
const-oid = "0.9"

[build-dependencies]
sha2 = "0.10"
hex = "0.4"